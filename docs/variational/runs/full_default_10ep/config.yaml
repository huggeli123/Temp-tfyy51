seed: 42
data:
  root: ct_data
  image_size: null
noise:
  train_val_std: 0.3
  test_std: 0.3
model:
  name: variational_unet
  channels: 32
  depth: 3
  kernel_size: 3
  activation: relu
  normalization: none
  num_groups: 4
augmentation:
  enabled: true
  horizontal_flip: true
  horizontal_flip_probability: 0.5
  rotation_degrees: 10
training:
  epochs: 10
  batch_size: 16
  num_workers: 0
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0
  loss: mse
  kl_weight: 0.1
output:
  directory: outputs
  save_best_model: true
  save_example_images: true
