seed: 42

data:
  root: ct_data
  image_size: null


noise:
  # Training and validation use the same noise level
  train_val_std: 0.3 #Change between 0.01 to 0.4

  # Can be changed independently for testing
  test_std: 0.3


model: # Options: [linear, nonlinear, residual_cnn, simple_cnn, unet, variational_simple_cnn, variational_unet, variational_partial_unet]
  name: variational_partial_unet

  # Number of feature maps/channels in hidden layers.
  # Ignored only by the linear model.
  channels: 32

  # Controls how deep the network is.
  # Ignored by linear and nonlinear models.
  depth: 3

  # Convolutional filter/kernel size.
  # Recommended: 3, 5, or 7
  kernel_size: 3

  # Options: [relu, leaky_relu, gelu, elu, silu, tanh]
  # Ignored by the linear model.
  activation: relu

  # Options: [none, batch, instance, group]
  # Ignored by the linear model.
  normalization: none

  # Only used for group normalization
  num_groups: 4

  # Only used by variational models.
  # Std of the N(0, p^2) prior over every weight. Kept wide so the KL only
  # acts on sigma and does not shrink the means (weight decay ~ beta/(p^2 N)).
  prior_standard_deviation: 1.0

  # Initial posterior std is sigma = softplus(rho) (~exp(rho) here).
  # Measured on the trained UNet: noise on the last decoder block costs
  # +0.5% loss at sigma 1e-3 and +7.7% at 3e-3, so start at 1.5e-3
  # (rho -6.5) and let training adapt it (see training.rho_learning_rate).
  # For the fully variational variational_unet use a much smaller value
  # (about -8): its wide layers are far more sensitive to weight noise.
  initial_rho: -6.5

  # Only used by variational_partial_unet.
  # How many decoder blocks, counted from the output end, are variational
  # (the 1x1 output conv always is). 0 = only the output conv,
  # 1 = + the finest decoder block, depth = the whole decoder.
  variational_decoder_levels: 1


augmentation:
  enabled: true

  horizontal_flip: true
  horizontal_flip_probability: 0.5

  # Random rotation between -10 and +10 degrees
  rotation_degrees: 10

training:
  epochs: 30
  batch_size: 16
  num_workers: 0

  # Options: [adam, adamw, sgd]
  optimizer: adam
  
  
  learning_rate: 0.001
  weight_decay: 0.0

  # Options: [mse, l1, smooth_l1]
  loss: mse

  # Only used by variational models (e.g. variational_simple_cnn).
  # Weight beta on the KL term: loss = recon + kl_weight * KL / dataset_size
  # recon is a per-pixel MEAN, so a properly scaled ELBO needs
  # beta ~ 2*s^2 / pixels_per_image ~ 5e-8. 0.1 was ~1e6x too large.
  # At equilibrium each weight's sigma balances recon curvature against
  # the KL, and the total loss cost is ~ n_variational * beta / (2 * N)
  # (N = training images). 1e-6 is a deliberately "warm" posterior:
  # ~2% loss cost for visible, data-dependent uncertainty.
  # Larger -> larger sigma, more uncertainty, worse MSE. 0 -> sigma shrinks.
  kl_weight: 0.000001

  # Only used by variational models. Separate learning rate for the
  # posterior std parameters (rho). At the shared lr 1e-3, rho barely
  # moves in a short run, so sigma stays at its initial value.
  # Remove or set to null to use learning_rate for rho as well.
  rho_learning_rate: 0.01


output:
  directory: outputs
  save_best_model: true
  save_example_images: true